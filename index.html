<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b5651d">
<title>韓国語初級完成編１</title>

<style>
  :root{
    --bg:#f7f3ec; --card:#ffffff; --cork:#e9c99b; --accent:#b5651d;
    --ok:#2e7d32; --ng:#c62828; --line:#e0d7c8; --text:#3a2f22;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;position:relative;}
  #menuBtn{position:fixed;top:10px;left:10px;z-index:100;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;}
  #sidebar{width:280px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:16px;padding-top:56px;overflow-y:auto;max-height:100vh;position:sticky;top:0;transition:margin-left .2s ease;}
  #app.collapsed #sidebar{margin-left:-280px;}
  #main{transition:none;}
  @media (max-width:768px){
    #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;box-shadow:0 0 12px rgba(0,0,0,.2);margin-left:-280px;}
    #app:not(.collapsed) #sidebar{margin-left:0;}
    #app:not(.collapsed) #overlay{display:block;}
    #main{padding:56px 14px 24px;max-width:100%;}
  }
  #sidebar h1{font-size:18px;margin:0 0 4px;}
  #sidebar .sub{font-size:12px;color:#888;margin-bottom:12px;}
  #progressSummary{font-size:13px;background:#fbf3e6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:14px;}
  #sessionList{list-style:none;margin:0;padding:0;}
  #sessionList li{margin-bottom:4px;}
  #sessionList button{width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  #sessionList button:hover{background:#f2ead8;}
  #sessionList button.active{background:var(--accent);color:#fff;}
  #sessionList .badge{font-size:11px;background:#eee;border-radius:10px;padding:1px 7px;color:#555;flex-shrink:0;}
  #sessionList button.active .badge{background:rgba(255,255,255,.25);color:#fff;}
  #sessionList button.done .badge{background:#d7ecd8;color:var(--ok);}
  #main{flex:1;padding:24px 32px;max-width:900px;}
  #welcome{color:#777;padding-top:60px;text-align:center;}
  .session-header{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
  .session-header h2{margin:0 0 6px;font-size:20px;}
  .session-header .instr{font-size:14px;color:#555;margin-bottom:6px;}
  .hintbox{display:inline-block;background:#fdf1de;border:1px solid #eccf9a;border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--accent);margin-top:4px;}
  .example{margin-top:8px;font-size:13.5px;color:#666;background:#f7f7f4;border-radius:6px;padding:6px 10px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;}
  .item .num{font-weight:bold;color:var(--accent);margin-right:6px;}
  .item .prompt{font-size:15px;margin-bottom:8px;line-height:1.5;}
  .item input[type=text], .item textarea{width:100%;padding:8px 10px;font-size:14px;border:1px solid #ccc;border-radius:6px;font-family:inherit;}
  .item textarea{resize:vertical;min-height:44px;}
  .choice-opt{display:block;margin:6px 0;font-size:14px;cursor:pointer;}
  .choice-opt input{margin-right:8px;}
  .item-controls{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;}
  .btn.secondary{background:#888;}
  .btn.small{padding:4px 9px;font-size:12px;}
  .btn:hover{opacity:.9;}
  .result{font-size:13px;font-weight:bold;padding:3px 8px;border-radius:6px;}
  .result.ok{color:var(--ok);background:#e6f4e6;}
  .result.ng{color:var(--ng);background:#fbe6e6;}
  .answer-reveal{font-size:13px;color:#444;background:#f2f2ea;border-radius:6px;padding:6px 10px;margin-top:6px;}
  .toolbar{display:flex;gap:10px;margin:18px 0 40px;align-items:center;flex-wrap:wrap;}
  #scoreBox{font-size:16px;font-weight:bold;background:#fff8ea;border:1px solid #eccf9a;padding:10px 16px;border-radius:10px;}
  .flag{font-size:11px;color:#999;margin-left:6px;}
  .ja{font-size:12.5px;color:#7a6a55;margin-top:4px;line-height:1.5;}
  .spk{margin-top:6px;display:flex;gap:6px;}
  .datatools{display:flex;gap:6px;margin-bottom:14px;}
  .datatools .btn{flex:1;}
  #sessionList button.review{border:1px solid #eccf9a;background:#fdf1de;font-weight:bold;margin-bottom:8px;}
  #sessionList button.review:not(.active):hover{background:#f8e6c4;}
  #sessionList button.review:not(.active) .badge{background:#f3d9a8;color:var(--accent);}
  .item .from{font-size:11.5px;color:#999;margin-bottom:4px;}
  .item details.ctx{margin:0 0 8px;font-size:12.5px;color:#666;}
  .item details.ctx summary{cursor:pointer;color:var(--accent);}
  .item details.ctx .instr{margin-top:4px;}
  .btn.done{background:var(--ok);}
  .btn.review{background:#d98b3a;}
  .review-empty{text-align:center;color:#777;padding:30px 10px;}
</style>
</head>
<body>
<button id="menuBtn" onclick="toggleSidebar()">☰</button>
<div id="overlay" onclick="toggleSidebar()"></div>
<div id="app">
  <div id="sidebar">
    <h1>韓国語文法練習</h1>
    <div class="sub">PDF練習問題ベース・個人学習用</div>
    <div id="progressSummary"></div>
    <div class="datatools">
      <button class="btn small secondary" onclick="exportData()">📤 進捗を書き出し</button>
      <button class="btn small secondary" onclick="document.getElementById('importFile').click()">📥 読み込み</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
    </div>
    <ul id="sessionList"></ul>
  </div>
  <div id="main">
    <div id="welcome">左のリストからセッションを選んでください。</div>
  </div>
</div>

/* ================= 상태 & 저장 ================= */
const STORE_KEY = 'koStudyProgress_v1';
let store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
if(!store.sessions) store.sessions = {};

function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

/* ---- 復習リスト（store.review = {'セッションID:問題番号': 1}） ----
   不正解になった問題が自動で入り、「復習済み」を押すまで残る */
function rkey(sid,idx){ return sid+':'+idx; }
function ensureReview(){
  if(store.review) return;
  store.review = {};
  // 復習機能の追加前に記録された不正解を、初回だけ引き継ぐ
  SESSIONS.forEach(s=>{
    const st = getSessState(s.id);
    Object.keys(st.correctness).forEach(i=>{
      if(st.correctness[i]===false) store.review[rkey(s.id,i)] = 1;
    });
  });
  saveStore();
}
function reviewItems(){
  const out = [];
  SESSIONS.forEach(s=>{
    s.items.forEach((it,idx)=>{ if(store.review[rkey(s.id,idx)]) out.push({s:s, idx:idx}); });
  });
  return out;
}
function markReviewed(sid, idx){
  delete store.review[rkey(sid,idx)];
  saveStore();
  renderSidebar();
  renderMain();
}

function getSessState(id){
  if(!store.sessions[id]) store.sessions[id] = {answers:{}, correctness:{}, choiceSel:{}};
  return store.sessions[id];
}

function normalize(s){
  return (s||'').toString()
    .replace(/\s+/g,'')
    .replace(/[.,!?~()'"“”‘’·]/g,'')
    .trim();
}

let currentSessionId = null;
ensureReview();

/* ================= 렌더링 ================= */
function renderSidebar(){
  const ul = document.getElementById('sessionList');
  ul.innerHTML = '';
  let totalScore=0, totalMax=0, doneCount=0;
  const rli = document.createElement('li');
  const rbtn = document.createElement('button');
  rbtn.className = (currentSessionId==='review'?'active ':'') + 'review';
  rbtn.innerHTML = `<span>📝 復習セッション</span><span class="badge">${reviewItems().length}問</span>`;
  rbtn.onclick = ()=>openSession('review');
  rli.appendChild(rbtn);
  ul.appendChild(rli);
  SESSIONS.forEach(s=>{
    const st = getSessState(s.id);
    const max = s.items.length*10;
    let score=0;
    s.items.forEach((it,idx)=>{ if(st.correctness[idx]===true) score+=10; });
    totalScore+=score; totalMax+=max;
    const answeredAll = Object.keys(st.correctness).length>0;
    if(answeredAll) doneCount++;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = (s.id===currentSessionId?'active ':'') + (answeredAll?'done':'');
    btn.innerHTML = `<span>${s.title}</span><span class="badge">${answeredAll? score+'/'+max : max+'点'}</span>`;
    btn.onclick = ()=>openSession(s.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
  document.getElementById('progressSummary').innerHTML =
    `全体の進捗: <b>${doneCount}/${SESSIONS.length}</b> セッション採点済み<br>累積点数: <b>${totalScore}</b> / ${totalMax}`;
}

function toggleSidebar(){
  document.getElementById('app').classList.toggle('collapsed');
}

function openSession(id){
  currentSessionId = id;
  store.lastSessionId = id;
  saveStore();
  renderSidebar();
  renderMain();
  if(window.innerWidth<=768){
    document.getElementById('app').classList.add('collapsed');
  }
  window.scrollTo(0,0);
}

function itemHtml(s, idx, inReview){
  const st = getSessState(s.id);
  const tr = TR[s.id] || {};
  const it = s.items[idx];
  const rid = s.id+'_'+idx;
  const savedAns = st.answers[idx] || '';
  const correctness = st.correctness[idx];
  let resultHtml = '';
  if(correctness===true) resultHtml = '<span class="result ok">✓ 正解</span>';
  else if(correctness===false) resultHtml = '<span class="result ng">✗ 不正解</span>';

  let html = `<div class="item" data-idx="${idx}">`;
  if(inReview){
    html += `<div class="from">${s.title}</div>
      <details class="ctx"><summary>出題の説明を見る</summary>
        <div class="instr">${s.instr||''}</div>
        ${tr.instr? `<div class="ja">${tr.instr}</div>`:''}
        ${s.hint? `<div class="hintbox">${s.hint}</div>`:''}
        ${tr.hint? `<div class="ja">${tr.hint}</div>`:''}
        ${s.example? `<div class="example">예) ${s.example}${tr.ex? `<div class="ja">${tr.ex}</div>`:''}</div>`:''}
      </details>`;
  }
  html += `<div class="prompt"><span class="num">${idx+1}.</span>${it.p}</div>`;

  if(s.type==='choice'){
    const sel = st.choiceSel[idx];
    it.o.forEach((opt,oi)=>{
      html += `<label class="choice-opt"><input type="radio" name="choice_${s.id}_${idx}" value="${oi}" ${sel==oi?'checked':''} onchange="onChoiceChange('${s.id}',${idx},${oi})"> ${opt}</label>`;
    });
  } else {
    html += `<textarea data-idx="${idx}" placeholder="答えを入力してください" oninput="onTextChange('${s.id}',${idx},this.value)">${savedAns}</textarea>`;
  }

  html += `<div class="item-controls">
      <button class="btn small" onclick="checkOne('${s.id}',${idx})">答え合わせ</button>
      <button class="btn small secondary" onclick="toggleReveal('${rid}')">正解を見る</button>
      ${inReview? `<button class="btn small done" onclick="markReviewed('${s.id}',${idx})">✔ 復習済み</button>`:''}
      ${resultHtml}
    </div>
    <div class="answer-reveal" id="reveal_${rid}" style="display:none;">正解: ${s.type==='choice'? it.o[it.c] : it.a.join(' / ')}${(tr.items&&tr.items[idx])? '<div class="ja">'+tr.items[idx]+'</div>':''}<div class="spk"><button class="btn small" onclick="speakAns('${s.id}',${idx},1)">🔊 再生</button><button class="btn small secondary" onclick="speakAns('${s.id}',${idx},0.6)">🐢 ゆっくり</button></div></div>
  </div>`;
  return html;
}

function renderReview(){
  const main = document.getElementById('main');
  const list = reviewItems();
  let html = `<div class="session-header">
    <h2>📝 復習セッション</h2>
    <div class="instr">全セッションで間違えた問題がここに集まります。正解しても残るので、覚えたら「復習済み」で外してください。</div>
    <div class="ja">復習する問題: ${list.length}問</div>
  </div>`;
  if(!list.length){
    html += `<div class="item review-empty">復習する問題はありません 🎉<br>各セッションで間違えた問題が、ここに自動で貯まります。</div>`;
  } else {
    list.forEach(r=>{ html += itemHtml(r.s, r.idx, true); });
  }
  main.innerHTML = html;
}

function renderMain(){
  const main = document.getElementById('main');
  if(currentSessionId==='review'){ renderReview(); return; }
  const s = SESSIONS.find(x=>x.id===currentSessionId);
  if(!s){ main.innerHTML = '<div id="welcome">左のリストからセッションを選んでください。</div>'; return; }
  const tr = TR[s.id] || {};

  let html = `<div class="session-header">
    <h2>${s.title}</h2>
    <div class="instr">${s.instr||''}</div>
    ${tr.instr? `<div class="ja">${tr.instr}</div>`:''}
    ${s.hint? `<div class="hintbox">${s.hint}</div>`:''}
    ${tr.hint? `<div class="ja">${tr.hint}</div>`:''}
    ${s.example? `<div class="example">예) ${s.example}${tr.ex? `<div class="ja">${tr.ex}</div>`:''}</div>`:''}
  </div>`;

  s.items.forEach((it,idx)=>{ html += itemHtml(s, idx, false); });

  html += `<div class="toolbar">
      <button class="btn" onclick="gradeAll('${s.id}')">まとめて採点</button>
      <button class="btn review" onclick="openSession('review')">📝 後で復習する（${reviewItems().length}問）</button>
      <button class="btn secondary" onclick="resetSession('${s.id}')">このセッションをリセット</button>
      <div id="scoreBox"></div>
    </div>`;

  main.innerHTML = html;
  updateScoreBox(s.id);
}

function toggleReveal(rid){
  const el = document.getElementById('reveal_'+rid);
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

function onTextChange(sid, idx, val){
  const st = getSessState(sid);
  st.answers[idx] = val;
  saveStore();
}

function onChoiceChange(sid, idx, oi){
  const st = getSessState(sid);
  st.choiceSel[idx] = oi;
  saveStore();
}

function checkOne(sid, idx){
  const s = SESSIONS.find(x=>x.id===sid);
  const st = getSessState(sid);
  const it = s.items[idx];
  let ok;
  if(s.type==='choice'){
    ok = st.choiceSel[idx] === it.c;
  } else {
    const userVal = st.answers[idx] || '';
    ok = isOK(s,it,userVal);
  }
  st.correctness[idx] = ok;
  if(!ok) store.review[rkey(sid,idx)] = 1;
  saveStore();
  renderSidebar();
  renderMain();
}

function gradeAll(sid){
  const s = SESSIONS.find(x=>x.id===sid);
  const st = getSessState(sid);
  s.items.forEach((it,idx)=>{
    let ok;
    if(s.type==='choice'){
      ok = st.choiceSel[idx] === it.c;
    } else {
      const userVal = st.answers[idx] || '';
      ok = isOK(s,it,userVal);
    }
    st.correctness[idx] = ok;
    if(!ok) store.review[rkey(sid,idx)] = 1;
  });
  saveStore();
  renderSidebar();
  renderMain();
}

function updateScoreBox(sid){
  const s = SESSIONS.find(x=>x.id===sid);
  const st = getSessState(sid);
  let score=0, graded=0;
  s.items.forEach((it,idx)=>{
    if(st.correctness[idx]!==undefined){ graded++; if(st.correctness[idx]) score+=10; }
  });
  const box = document.getElementById('scoreBox');
  if(box) box.textContent = `採点結果: ${score} / ${s.items.length*10}点 (${graded}/${s.items.length}問採点済み)`;
}

function resetSession(sid){
  if(!confirm('このセッションの回答と採点記録をリセットしますか?')) return;
  store.sessions[sid] = {answers:{}, correctness:{}, choiceSel:{}};
  saveStore();
  renderSidebar();
  renderMain();
}

/* 정답확인/전체채점 후 점수박스 갱신을 위해 renderMain 후 항상 호출됨 (updateScoreBox는 renderMain 끝에서 호출) */

/* ================= 判定（表記ゆれ・합니다체/해요체の両対応） ================= */
const NOREG = ['s29','s30','s31','s32','s33','s42','s44']; // 丁寧体変換を行わないセッション
const H = c=>{const n=c.charCodeAt(0)-44032; return (n<0||n>11171)?null:[Math.floor(n/588),Math.floor(n%588/28),n%28];};
const M = (a,b,c)=>String.fromCharCode(44032+a*588+b*28+c);
function canon(s){ return normalize(s).replace(/되었/g,'됐').replace(/하였/g,'했').replace(/되어/g,'돼').replace(/하여/g,'해'); }
function toHap(w,q){ // 해요체 → 합니다체
  const e=q?'니까':'니다';
  if(w.slice(-1)!=='요') return [];
  if(/거예요$/.test(w)) return [w.slice(0,-3)+'겁'+e];
  if(/(이에요|예요)$/.test(w)) return [w.replace(/(이에요|예요)$/,'입'+e)];
  if(/세요$/.test(w)) return [w.slice(0,-2)+(q?'십니까':'십시오')];
  const b=w.slice(0,-1), x=H(b.slice(-1)); if(!x||x[2]) return [];
  const p=b.slice(0,-1), pp=H(p.slice(-1)), [c,j]=x;
  if(c===18&&j===1) return [p+'합'+e];
  if(c===3&&j===1) return [p+'됩'+e];
  if(c===11&&(j===0||j===4)&&pp){
    if(pp[2]===8) return [p.slice(0,-1)+M(pp[0],pp[1],17)+e];
    if(pp[2]) return [p+'습'+e];
  }
  const f=(...js)=>js.map(v=>p+M(c,v,17)+e);
  return ({0:()=>f(0,18),4:()=>f(4,18),1:()=>f(1),5:()=>f(5),6:()=>f(20,6),9:()=>f(8),14:()=>f(13)}[j]||(()=>[]))();
}
function toHae(w,q){ // 합니다체 → 해요체
  const m=w.match(/^(.*)(니다|니까)$/); if(!m) return [];
  const b=m[1], s=b.slice(-1), p=b.slice(0,-1), x=H(s); if(!x) return [];
  const [c,j,t]=x;
  if(s==='입') return [p+'이에요',p+'예요'];
  if(s==='겁') return [p+'거예요'];
  if(s==='습'){ const pp=H(p.slice(-1)); if(!pp) return []; return [p+((pp[2]!==20&&(pp[1]===0||pp[1]===8))?'아요':'어요')]; }
  if(t!==17) return [];
  if(c===18&&j===0) return [p+'해요'];
  if(c===3&&j===11) return [p+'돼요'];
  const z=(...js)=>js.map(v=>p+M(c,v,0)+'요');
  const r=({0:()=>z(0),4:()=>z(4),1:()=>z(1),5:()=>z(5),8:()=>z(9),13:()=>z(14),20:()=>z(6),18:()=>z(0,4)}[j]||(()=>[]))();
  r.push(p+M(c,j,8)+((j===0||j===8)?'아요':'어요')); // ㄹ語幹
  return r;
}
function regVars(sent){
  const m=sent.match(/^(.*?)([^\s.?!]+)([.?!]?)\s*$/); if(!m) return [sent];
  const [,pre,w,pu]=m, q=pu==='?', out=[sent];
  const c=/요$/.test(w)?toHap(w,q):(/(니다|니까)$/.test(w)?toHae(w,/니까$/.test(w)):[]);
  c.forEach(v=>out.push(pre+v+pu));
  return out;
}
function allVars(a){
  const parts=a.match(/[^.?!]+[.?!]?\s*/g)||[a];
  let out=[''];
  parts.forEach(p=>{ const v=regVars(p.trim()); out=out.flatMap(o=>v.map(x=>o+' '+x)); });
  return out;
}
function isOK(s,it,u){
  const n=canon(u); if(!n) return false;
  return it.a.some(a=> (NOREG.includes(s.id)?[a]:allVars(a)).some(v=>canon(v)===n));
}

/* ================= 音声再生（端末の音声機能） ================= */
function speakAns(sid,idx,rate){
  if(!('speechSynthesis' in window)){ alert('このブラウザは音声再生に対応していません。'); return; }
  const s=SESSIONS.find(x=>x.id===sid), it=s.items[idx];
  const text=(s.type==='choice'? it.o[it.c] : it.a[0]).replace(/\([^)]*\)/g,'');
  const voices=speechSynthesis.getVoices();
  const ko=voices.find(v=>/^ko/i.test(v.lang));
  if(voices.length && !ko){ alert('この端末に韓国語音声が見つかりません。端末の設定で韓国語の音声を追加してください。'); return; }
  speechSynthesis.cancel();
  text.split(/\s*[가나]:\s*/).filter(x=>x.trim()).forEach(part=>{
    const u=new SpeechSynthesisUtterance(part);
    u.lang='ko-KR'; u.rate=rate; if(ko) u.voice=ko;
    speechSynthesis.speak(u);
  });
}
if('speechSynthesis' in window) speechSynthesis.getVoices();

/* ================= 進捗の書き出し・読み込み ================= */
function exportData(){
  const d={app:'ko-study',version:1,exported:new Date().toISOString(),store:store};
  const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const name='kankokugo-progress_'+new Date().toISOString().slice(0,10)+'.json';
  const f=new File([blob],name,{type:'application/json'});
  if(/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[f]})){
    navigator.share({files:[f]}).catch(()=>{}); return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(inp){
  const file=inp.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=='ko-study'||!d.store||!d.store.sessions) throw new Error('形式が違います');
      if(!confirm('現在の進捗を、読み込むファイルの内容で上書きします。よろしいですか？')) return;
      store=d.store; ensureReview(); saveStore();
      if(store.lastSessionId==='review' || (store.lastSessionId && SESSIONS.some(s=>s.id===store.lastSessionId))) currentSessionId=store.lastSessionId;
      renderSidebar(); renderMain();
      alert('進捗を読み込みました。');
    }catch(e){ alert('読み込めませんでした: '+e.message); }
    inp.value='';
  };
  r.readAsText(file);
}
